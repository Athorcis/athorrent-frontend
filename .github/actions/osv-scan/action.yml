name: OSV Security Scan
description: Scan lockfiles for vulnerabilities and malicious packages

runs:
    using: composite
    steps:
        - name: Scan for vulnerabilities and malicious packages
          uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
          continue-on-error: true
          with:
              scan-args: |
                  --lockfile=yarn.lock
                  --lockfile=tests/yarn.lock
                  --lockfile=composer.lock
                  --format=json
                  --output=osv-results.json

        - name: Check for critical and malicious vulnerabilities
          shell: bash
          run: |
              if [ ! -f osv-results.json ]; then
                  echo "No scan results found, skipping check"
                  exit 0
              fi

              # Check for malicious packages (MAL-* IDs)
              MALICIOUS=$(jq '[.results[].packages[].vulnerabilities[].id // "" | select(startswith("MAL-"))] | length' osv-results.json 2>/dev/null || echo "0")

              # Check for critical vulnerabilities using pre-computed max_severity from groups (CVSS >= 9.0)
              # groups[].max_severity is a string like "9.2", "7.5", etc.
              CRITICAL=$(jq '[.results[].packages[] |
                .groups // [] | .[] | select((.max_severity // "" | tonumber) >= 9.0) | .ids[]
              ] | length' osv-results.json 2>/dev/null || echo "0")

              echo "Found $MALICIOUS malicious packages and $CRITICAL critical vulnerabilities"

              if [ "$MALICIOUS" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
                  echo "::error::Found critical or malicious vulnerabilities"
                  jq -r '.results[].packages[] | .package as $pkg | .vulnerabilities[] | select(.id | startswith("MAL-")) | "\(.id) \($pkg.name)@\($pkg.version)"' osv-results.json 2>/dev/null || true
                  # List critical vulns by finding groups with max_severity >= 9.0 and matching their IDs
                  jq -r '.results[].packages[] | .package as $pkg |
                    (.groups // [] | .[] | select((.max_severity // "" | tonumber) >= 9.0) | .ids[]) as $crit_id |
                    .vulnerabilities[] | select(.id == $crit_id) | "\(.id) \($pkg.name)@\($pkg.version)"' osv-results.json 2>/dev/null || true
                  exit 1
              fi
