name: Build and test Docker images
description: Build local Docker images, run the Cypress E2E suite, and collect failure diagnostics

inputs:
    artifact-name:
        description: Name for the uploaded Cypress failure artifacts
        required: true

runs:
    using: composite
    steps:
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Build local images
          shell: bash
          run: |
              docker/scripts/build.sh \
              --set "*.cache-from=type=gha,scope=build-${GITHUB_REF_NAME}" \
              --set "*.cache-to=type=gha,mode=max,scope=build-${GITHUB_REF_NAME}"

        - name: Run Cypress tests
          shell: bash
          run: docker/scripts/test.sh

        - name: Upload Cypress artifacts
          if: failure()
          uses: actions/upload-artifact@v7
          with:
              name: ${{ inputs.artifact-name }}
              path: |
                  tests/cypress/screenshots
                  tests/cypress/videos
              if-no-files-found: ignore

        - name: Dump docker logs on failure
          if: failure()
          shell: bash
          run: docker logs athorrent-test-backend-manager-1
