name: build

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
    workflow_dispatch:

env:
    REGISTRY: ghcr.io

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        if: github.ref != 'refs/heads/master'
        runs-on: ubuntu-latest
        timeout-minutes: 90

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Run E2E suite
              uses: ./.github/actions/e2e
              with:
                  artifact-name: cypress-artifacts

    build:
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Extract metadata (tags, labels) for Docker
              id: meta-php
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository }}-php
                  bake-target: php
                  tags: |
                      type=ref,event=branch
                      type=sha,format=long,prefix=

            - name: Extract metadata (tags, labels) for Docker
              id: meta-nginx
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository }}-nginx
                  bake-target: nginx
                  tags: |
                      type=ref,event=branch
                      type=sha,format=long,prefix=

            - name: Build commit-tagged Docker images
              uses: docker/bake-action@v7
              with:
                  source: .
                  push: true
                  files: |
                      docker/build-bake.hcl
                      cwd://${{ steps.meta-php.outputs.bake-file }}
                      cwd://${{ steps.meta-nginx.outputs.bake-file }}
                  set: |
                      *.cache-from=type=gha,scope=build-${{ github.ref_name }}
                      *.cache-to=type=gha,mode=max,scope=build-${{ github.ref_name }}

    validate:
        needs: build
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        timeout-minutes: 90

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata for php image
              id: meta-php
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository }}-php
                  tags: type=sha,format=long,prefix=

            - name: Extract metadata for nginx image
              id: meta-nginx
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository }}-nginx
                  tags: type=sha,format=long,prefix=

            - name: Run E2E suite against built images
              uses: ./.github/actions/e2e
              with:
                  artifact-name: cypress-built-image-artifacts
              env:
                  ATHORRENT_PHP_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}-php:${{ github.sha }}
                  ATHORRENT_NGINX_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}-nginx:${{ github.sha }}
