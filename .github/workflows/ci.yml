name: build

on:
    push:
        branches:
            - master
        tags:
            - 'v*'
    pull_request:
        branches:
            - master
    workflow_dispatch:

env:
    REGISTRY: ghcr.io

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        if: github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        timeout-minutes: 90

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Run E2E suite
              uses: ./.github/actions/e2e
              with:
                  artifact-name: cypress-artifacts

    build:
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        timeout-minutes: 90

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Run E2E suite against built images
              uses: ./.github/actions/e2e
              with:
                  artifact-name: cypress-built-image-artifacts

            - name: Set up Trivy
              uses: aquasecurity/setup-trivy@v0.3.1

            - name: Set up ORAS
              uses: oras-project/setup-oras@v2.0.3

            - name: Generate image SBOMs
              run: bash docker/scripts/generate-sbom.sh

            - name: Publish tested Docker images
              shell: bash
              env:
                  REGISTRY: ${{ env.REGISTRY }}
                  REGISTRY_USERNAME: ${{ github.actor }}
                  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
                  SOURCE_REVISION: ${{ github.sha }}
                  PUBLISH_BRANCH: master
              run: bash docker/scripts/publish.sh
