
date.timezone="Europe/Paris"
intl.default_locale="fr"

apc.enable_cli=1

; Add into $_REQUEST GET, then POST parameters. Exclude COOKIES, they can be set by other means.
; Default: same as variables_order
request_order="GP"

; Disable `<?` tags, use `<?php` instead
; Default: On
short_open_tag=Off

; Disable loading extensions at runtime with dl()
; Default: On
enable_dl=Off

; Reject uninitialized client-supplied session IDs.
session.use_strict_mode=1

; Disable PHP session-based upload progress tracking.
session.upload_progress.enabled=Off

; maximum memory that OPcache can use to store compiled PHP files
opcache.memory_consumption=256

; maximum number of files that can be stored in the cache
opcache.max_accelerated_files=20000

session.save_path=/var/lib/php/session

; 0 removes PHP's per-request upload and POST size limits.
upload_max_filesize = 0
post_max_size = 0
