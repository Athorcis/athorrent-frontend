# Shared across workers; static qB WebUI assets are identical for every user.
fastcgi_cache_path /var/cache/nginx/qb_assets
    levels=1:2
    keys_zone=qb_assets:10m
    max_size=256m
    inactive=30d
    use_temp_path=off;

# Strip optional /{locale} so /en/user/qb/css/... and /user/qb/css/... share a cache entry.
map $uri $qb_asset_cache_uri {
    "~*^/(?:[a-z]{2}/)?(user/qb/(?:scripts|css|images|views)/.*)$" /$1;
    default $uri;
}

server {
    gzip on;
    gzip_http_version 1.0;
    gzip_proxied any;

    listen 80 default_server;

    server_name athorrent.local;
    root /var/www/athorrent/public;

    server_tokens off;
    client_max_body_size 0;

    location / {
        # try to serve file directly, fallback to index.php
        try_files $uri /index.php$is_args$args;
    }

    # optionally disable falling back to PHP script for the asset directories;
    # nginx will return a 404 error when files are not found instead of passing the
    # request to Symfony (improves performance but Symfony's 404 page is not displayed)
    location /build {
        try_files $uri =404;
        access_log off;
        expires max;
        gzip_static on;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }

    # Hard-cache qBittorrent WebUI static assets by path prefix (not /api/).
    # Cache key ignores cookies so a 200 can be reused across users/sessions.
    location ~* "^/(?:[a-z]{2}/)?user/qb/(?:scripts|css|images|views)/" {
        fastcgi_pass php:9000;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_cache qb_assets;
        fastcgi_cache_key $request_method$qb_asset_cache_uri;
        fastcgi_cache_methods GET HEAD;
        fastcgi_cache_valid 200 30d;
        fastcgi_ignore_headers Cache-Control Expires Set-Cookie Vary;
        fastcgi_hide_header Set-Cookie;

        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header X-Cache-Status $upstream_cache_status;
        access_log off;
    }

    location /user-files/ {
        alias /var/www/athorrent/var/user/;

        mp4;

		sendfile on;
		aio threads;
		tcp_nopush on;
        directio 4m;
        output_buffers 1 4m;

        add_header X-Content-Type-Options nosniff;

		internal;
    }

    location ~ ^/index\.php(/|$) {
        # when PHP-FPM is configured to use TCP
        fastcgi_pass php:9000;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # optionally set the value of the environment variables used in the application
        fastcgi_param  HTTP_X-Sendfile-Type     X-Accel-Redirect;
        fastcgi_param  HTTP_X-Accel-Mapping    /var/www/athorrent/var/user/=/user-files/;

        # When you are using symlinks to link the document root to the
        # current version of your application, you should pass the real
        # application path instead of the path to the symlink to PHP
        # FPM.
        # Otherwise, PHP's OPcache may not properly detect changes to
        # your PHP files (see https://github.com/zendtech/ZendOptimizerPlus/issues/126
        # for more information).
        # Caveat: When PHP-FPM is hosted on a different machine from nginx
        #         $realpath_root may not resolve as you expect! In this case try using
        #         $document_root instead.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Prevents URIs that include the front controller. This will 404:
        # http://example.com/index.php/some-path
        # Remove the internal directive to allow URIs like this
        internal;
    }

    # return 404 for all other php files not matching the front controller
    # this prevents access to other php files you don't want to be accessible.
    location ~ \.php$ {
        return 404;
    }
}
