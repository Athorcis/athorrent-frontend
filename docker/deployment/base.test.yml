
x-php-base: &php-base
    build:
        args: &build_args
            SYMFONY_APP_ENV: test
            COMPOSER_ARGS: ""
    env_file:
        - ../../.env.test

services:
    backend-manager:
        <<: *php-base

    php:
        tmpfs:
            - /var/lib/php/session
        <<: *php-base

    nginx:
        build:
            args: *build_args
